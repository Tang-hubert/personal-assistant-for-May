[project]
name = "personal-assistant-for-may"
version = "0.1.0"
description = "Senior-friendly multi-tenant AI assistant (Telegram first, LINE-ready)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "tzdata>=2024.2",
    "opencv-python-headless>=5.1.0.95",
    "imagehash>=4.3.2",
    "pillow-heif>=1.8.1",
    "google-genai>=3.6.1",
    "openai>=3.57.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ", "PTH", "ASYNC", "RUF"]
ignore = ["SIM300"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
